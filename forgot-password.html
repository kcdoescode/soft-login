<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Soft Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-mesh" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-container">
    <div class="form-card single-card">
      <div class="form-side">

        <div class="form-state" id="formState">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-1.5 1.5L14 9a5.5 5.5 0 1 0 1 1l3.5-3.5 2 2 2-2-2-2z"></path>
            </svg>
          </div>
          <h2 class="form-title">Reset Password</h2>
          <p class="form-subtitle">Enter your email address and we’ll send a link to reset your password.</p>
          <form id="forgotForm">
            <input type="email" id="resetEmail" placeholder="Email Address" required autocomplete="email">
            <button type="submit" class="btn">
              <span class="btn-text">Send Reset Link</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <p class="switch-text">Remember your password? <a href="index.html">Log In</a></p>
          </form>
        </div>

        <div class="success-state" id="successState">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <h2 class="form-title">Check Your Email</h2>
          <p class="form-subtitle">We’ve sent recovery instructions to <strong id="sentEmailDisplay" style="color:#ffffff;"></strong>.</p>
          <a href="index.html" class="btn" style="display:flex; text-align:center; text-decoration:none;">Back to Login</a>
          <button type="button" class="btn btn-secondary" id="resendBtn">Resend Link</button>
          <p class="switch-text"><a href="#" id="tryAnotherEmail">Try another email</a></p>
        </div>

      </div>
    </div>
  </div>

  <script>
    const forgotForm = document.getElementById('forgotForm');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const resetEmail = document.getElementById('resetEmail');
    const sentEmailDisplay = document.getElementById('sentEmailDisplay');
    const resendBtn = document.getElementById('resendBtn');
    const tryAnotherEmail = document.getElementById('tryAnotherEmail');

    forgotForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = resetEmail.value.trim();
      if (!email) return;

      const btn = forgotForm.querySelector('.btn');
      btn.classList.add('is-loading');

      setTimeout(() => {
        btn.classList.remove('is-loading');
        sentEmailDisplay.textContent = email;
        formState.classList.add('hidden');
        successState.classList.add('active');
      }, 700);
    });

    tryAnotherEmail.addEventListener('click', (e) => {
      e.preventDefault();
      successState.classList.remove('active');
      formState.classList.remove('hidden');
      resetEmail.focus();
    });

    resendBtn.addEventListener('click', () => {
      const originalText = resendBtn.textContent;
      resendBtn.textContent = 'Link Resent! ✓';
      resendBtn.disabled = true;
      setTimeout(() => {
        resendBtn.textContent = originalText;
        resendBtn.disabled = false;
      }, 2500);
    });
  </script>
</body>
</html>
